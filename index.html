<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイ語単語帳(テスト版)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2E35; --ink-soft:#4B5D63; --bg:#FAF6EC; --panel:#FFFFFF;
  --gold:#D9A441; --gold-deep:#B9832B; --jade:#3E7C6B; --clay:#B5533C;
  --line:#E7DFCB; --radius:18px;
}
body.premium-theme{
  --ink:#2D1B4E; --ink-soft:#6B5B8A; --bg:#F5F0FA; --panel:#FFFFFF;
  --gold:#C9A84C; --gold-deep:#A68622; --jade:#6B3FA0; --clay:#C0392B;
  --line:#DDD4EA;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans Thai','Noto Sans JP',sans-serif;min-height:100vh;
  transition:background-color .4s, color .4s;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 90px;}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
header.top h1{font-family:'Shippori Mincho','Noto Serif Thai',serif;font-size:22px;font-weight:700;margin:0;}
header.top .thai-mark{font-family:'Noto Serif Thai',serif;color:var(--gold-deep);font-size:15px;}
.premium-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;white-space:nowrap;}
.premium-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.premium-note{font-size:10px;color:var(--ink-soft);text-align:right;margin-bottom:14px;font-family:'Zen Kaku Gothic New',sans-serif;}

.beads{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 18px;}
.bead{width:9px;height:9px;border-radius:50%;background:var(--line);flex:0 0 auto;transition:background .25s;}
.bead.done{background:var(--gold);}
.bead.cur{background:var(--clay);box-shadow:0 0 0 3px rgba(192,57,43,.18);}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.filter-label{font-size:11px;font-weight:700;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;letter-spacing:.04em;margin-right:1px;}
.chip.register{margin-left:auto;}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:7px 14px;
  border-radius:999px;font-size:13px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
select.catsel{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;
  border-radius:999px;font-size:13px;font-family:'Zen Kaku Gothic New',sans-serif;max-width:100%;}

.tabs{display:flex;gap:6px;margin:14px 0 4px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:4px;overflow-x:auto;}
.tab{flex:1;text-align:center;padding:9px 6px;border-radius:999px;cursor:pointer;font-size:12.5px;
  font-weight:600;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;white-space:nowrap;}
.tab.active{background:var(--ink);color:var(--bg);}
.desc-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:6px 0 12px;}
.mode-desc{font-size:11.5px;color:var(--ink-soft);margin:0 0 0 4px;font-family:'Zen Kaku Gothic New',sans-serif;flex:1 1 auto;}
.meta-line{font-size:12px;color:var(--ink-soft);margin-bottom:10px;font-family:'Zen Kaku Gothic New',sans-serif;}

.review-banner{background:#F8E8E6;border:1px solid var(--clay);color:var(--clay);border-radius:12px;
  padding:10px 14px;font-size:12.5px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:600;
  margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.review-banner button{border:none;background:var(--clay);color:#fff;border-radius:999px;padding:6px 12px;
  font-size:11px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;}

.card-area{display:flex;flex-direction:column;align-items:center;gap:16px;}
.card{width:100%;min-height:230px;background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 22px;cursor:pointer;box-shadow:0 10px 30px -18px rgba(45,27,78,.30);}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 10px,var(--jade) 10px 20px);opacity:.55;}
.card .lvl-tag{position:absolute;top:16px;right:16px;font-size:11px;padding:3px 10px;border-radius:999px;
  background:var(--bg);color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;font-weight:600;border:1px solid var(--line);}
.speak-btn{position:absolute;top:14px;left:14px;border:1px solid var(--line);background:var(--bg);
  border-radius:999px;width:38px;height:38px;font-size:17px;cursor:pointer;}
.card .thai-word{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:clamp(28px,7vw,40px);text-align:center;}
.card .kana{font-size:13px;color:var(--ink-soft);margin-top:6px;font-family:'Zen Kaku Gothic New',sans-serif;}
.card .meaning{font-family:'Shippori Mincho',serif;font-size:22px;text-align:center;color:var(--jade);margin-top:6px;}
.card .hint{margin-top:14px;font-size:12px;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;}
.card .category-tag{margin-top:12px;font-size:11px;color:var(--gold-deep);font-family:'Zen Kaku Gothic New',sans-serif;}
.example-box{margin-top:16px;width:100%;background:var(--bg);border:1px dashed var(--line);border-radius:12px;
  padding:12px 14px;font-size:13px;position:relative;}
.example-box .ex-th{font-family:'Noto Serif Thai',serif;font-size:16px;margin-bottom:4px;padding-right:34px;}
.example-box .ex-ja{font-family:'Noto Sans JP',sans-serif;color:var(--ink-soft);font-size:12.5px;}
.example-box .ex-loading{color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;}
.example-box .ex-label{font-size:10px;color:var(--gold-deep);font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;margin-bottom:6px;}
.example-box .ex-speak{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:var(--panel);
  border-radius:999px;width:30px;height:30px;font-size:13px;cursor:pointer;}
.example-box.locked{text-align:center;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;}

.card-controls{display:flex;gap:10px;width:100%;}
.btn{flex:1;padding:13px 10px;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;
  font-family:'Zen Kaku Gothic New',sans-serif;}
.btn.again{background:#F3E4DD;color:var(--clay);}
.btn.known{background:var(--jade);color:#fff;}
.btn.shuffle{background:var(--panel);color:var(--ink-soft);border:1px solid var(--line);flex:0 0 auto;padding:13px 16px;}

.quiz-q{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:30px 20px;
  text-align:center;margin-bottom:16px;position:relative;overflow:hidden;}
.quiz-q::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--jade) 0 10px,var(--gold) 10px 20px);opacity:.55;}
.quiz-q .qword{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:clamp(24px,6vw,32px);}
.quiz-q .kana{font-size:12px;color:var(--ink-soft);margin-top:6px;font-family:'Zen Kaku Gothic New',sans-serif;}
.quiz-choices{display:grid;gap:10px;}
.choice{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;
  text-align:left;font-size:15px;cursor:pointer;}
.choice.correct{border-color:var(--jade);background:#EDE6F5;color:var(--jade);font-weight:600;}
.choice.wrong{border-color:var(--clay);background:#F8E8E6;color:var(--clay);font-weight:600;}
.choice .ch-th{display:block;margin-top:5px;font-family:'Noto Serif Thai',serif;font-size:14px;color:var(--ink-soft);font-weight:400;cursor:pointer;}
.choice.correct .ch-th{color:var(--jade);}
.quiz-score{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:12px;font-family:'Zen Kaku Gothic New',sans-serif;}
.next-btn{width:100%;padding:14px;border:none;border-radius:14px;background:var(--ink);color:var(--bg);
  font-weight:700;font-size:14px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;margin-top:12px;}

.search-box{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);font-size:15px;
  margin-bottom:14px;background:var(--panel);color:var(--ink);}
.search-results{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;}
.result-row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;}
.result-row .rt{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:17px;}
.result-row .rk{font-size:10.5px;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;}
.result-row .rm{font-family:'Shippori Mincho',serif;color:var(--jade);font-size:14px;text-align:right;}
.result-row .rc{font-size:10px;color:var(--ink-soft);display:block;margin-top:2px;font-family:'Zen Kaku Gothic New',sans-serif;}
.mini-speak{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:30px;height:30px;
  font-size:12px;cursor:pointer;flex:0 0 auto;}

.list-actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:flex-end;}
.list-actions button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;
  border-radius:999px;font-size:12.5px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:600;}
.list-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;}
.list-table th{text-align:left;font-size:11px;color:var(--ink-soft);background:var(--bg);padding:9px 10px;
  font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;}
.list-table td{padding:9px 10px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:top;}
.list-table td.tw{font-family:'Noto Serif Thai',serif;font-weight:600;width:30%;}
.list-table td.tw .k{display:block;font-size:10px;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;font-weight:400;margin-top:2px;}
.list-table td.mw{font-family:'Shippori Mincho',serif;color:var(--jade);width:26%;}
.list-table td.ew{font-size:12px;color:var(--ink);width:44%;}
.list-table td.ew .eja{color:var(--ink-soft);font-size:11px;display:block;margin-top:2px;}
.list-table td.ew.lock{color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;font-size:11px;}
.copied-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:12.5px;font-family:'Zen Kaku Gothic New',sans-serif;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;}
.copied-toast.show{opacity:1;}

.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;}
.stat-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;}
.stat-box .num{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:22px;}
.stat-box .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;font-family:'Zen Kaku Gothic New',sans-serif;}
.stat-box.known .num{color:var(--jade);}
.stat-box.learning .num{color:var(--clay);}
.review-cta{width:100%;padding:14px;border:none;border-radius:14px;background:var(--clay);color:#fff;
  font-weight:700;font-size:14px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;margin:4px 0 18px;}
.review-cta:disabled{background:var(--line);color:var(--ink-soft);cursor:default;}
.level-bar{margin-bottom:10px;}
.level-bar .lvl-name{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;font-family:'Zen Kaku Gothic New',sans-serif;}
.level-bar .bar-track{height:10px;border-radius:999px;background:var(--line);overflow:hidden;display:flex;}
.level-bar .bar-fill.known{background:var(--jade);}
.level-bar .bar-fill.learning{background:var(--clay);}
.empty{text-align:center;padding:40px 10px;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;}

/* quiz results */
.qr-list{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
.qr-row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;}
.qr-row .qr-mark{font-size:16px;flex:0 0 auto;font-weight:700;}
.qr-row.ok .qr-mark{color:var(--jade);}
.qr-row.ng .qr-mark{color:var(--clay);}
.qr-row .qr-thai{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:16px;}
.qr-row .qr-kana{font-size:10px;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;}
.qr-row .qr-ans{font-size:12px;margin-top:2px;}
.qr-row .qr-ans .good{color:var(--jade);}
.qr-row .qr-ans .bad{color:var(--clay);text-decoration:line-through;margin-right:6px;}
.qr-row .qr-others{font-size:10px;color:var(--ink-soft);opacity:.65;margin-top:5px;line-height:1.6;}
.qr-row .qr-other{margin-right:8px;display:inline-block;}
.qr-row .qr-other-th{font-family:'Noto Serif Thai',serif;margin-left:3px;}
/* stats word lists */
.stat-box{cursor:pointer;}
.stat-box.selected{outline:2px solid var(--gold);}
.stat-list{display:flex;flex-direction:column;gap:6px;margin:0 0 18px;max-height:50vh;overflow-y:auto;}
.stat-list .sl-row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;
  display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;}
.stat-list .sl-th{font-family:'Noto Serif Thai',serif;font-weight:600;}
.stat-list .sl-k{display:block;font-size:9.5px;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;}
.stat-list .sl-m{font-family:'Shippori Mincho',serif;color:var(--jade);text-align:right;font-size:12.5px;}
.stat-list-title{font-size:12px;font-weight:700;color:var(--ink-soft);margin:2px 0 8px;font-family:'Zen Kaku Gothic New',sans-serif;}
.reset-link{display:block;text-align:center;margin-top:20px;font-size:12px;color:var(--ink-soft);
  text-decoration:underline;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;}

.chip.register{border-color:var(--jade);color:var(--jade);}
.chip.register.active{background:var(--jade);color:#fff;}
/* カード/クイズ画面の学習トグル(iOS風スイッチ) */
.study-toggles{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;}
.study-toggle{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
.study-toggle .st-label{font-size:12px;font-weight:700;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;}
.study-toggle.locked{opacity:.55;}
.switch{position:relative;width:42px;height:24px;border-radius:999px;background:var(--line);flex:0 0 auto;transition:background .25s;}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .25s;}
.switch.on{background:var(--gold-deep);}
.switch.on .knob{transform:translateX(18px);}
.appx-subtabs{display:flex;gap:6px;margin-bottom:10px;}
.appx-subtab{flex:1;text-align:center;padding:9px 6px;border:1px solid var(--jade);border-radius:12px;color:var(--jade);font-size:13px;font-weight:700;cursor:pointer;background:var(--panel);transition:.15s;}
.appx-subtab.active{background:var(--jade);color:#fff;}
.appx-desc{font-size:12px;color:var(--ink-soft);margin-bottom:12px;line-height:1.5;}
.reg-grid{display:flex;flex-direction:column;gap:6px;}
.reg-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.reg-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;}
.reg-header .reg-concept{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:700;color:var(--ink);}
.reg-header .reg-arrow{font-size:12px;color:var(--ink-soft);transition:transform .2s;}
.reg-card.open .reg-arrow{transform:rotate(180deg);}
.reg-body{display:none;padding:0 14px 14px;}
.reg-card.open .reg-body{display:block;}
.reg-note{font-size:11px;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;margin-bottom:10px;}
.reg-members{display:flex;flex-direction:column;gap:6px;}
.reg-row{display:grid;grid-template-columns:68px 1fr auto;gap:6px;align-items:center;padding:7px 10px;
  background:var(--bg);border-radius:10px;}
.reg-row .reg-label{font-size:10.5px;font-weight:600;color:var(--gold-deep);font-family:'Zen Kaku Gothic New',sans-serif;}
.reg-row .reg-thai{font-family:'Noto Serif Thai',serif;font-weight:600;font-size:15px;}
.reg-row .reg-kana{font-size:10.5px;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;}
.reg-row .reg-rnote{font-size:10px;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;grid-column:2/3;}
.reg-row .reg-speak{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:28px;height:28px;
  font-size:11px;cursor:pointer;flex:0 0 auto;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>タイ語単語帳</h1>
      <div class="thai-mark">คำศัพท์ภาษาไทย ・ テスト版</div>
    </div>
    <button class="premium-btn" id="premiumBtn">🔒 無料版</button>
  </header>
  <div class="premium-note">※共有テスト版:決済なし(表示切替のみ)・学習記録はこのブラウザ内に保存されます</div>

  <div class="filters" id="levelFilters"></div>
  <div class="filters" id="catFilterWrap"></div>

  <div class="tabs">
    <div class="tab active" data-mode="card">カード</div>
    <div class="tab" data-mode="quiz">4択クイズ</div>
    <div class="tab" data-mode="list">一覧</div>
    <div class="tab" data-mode="search">検索</div>
    <div class="tab" data-mode="stats">記録</div>
  </div>
  <div class="desc-row">
    <div class="mode-desc" id="modeDesc"></div>
    <div class="study-toggles" id="studyToggles"></div>
  </div>
  <div id="view"></div>
</div>

/* ---------- speech ---------- */
let thaiVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  thaiVoice = vs.find(v=>v.lang && v.lang.toLowerCase().startsWith('th')) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speakThai(text){
  if(!('speechSynthesis' in window)){ toast('この端末は音声再生に未対応です'); return; }
  const clean = text.replace(/[（(][^)）]*[)）]/g,'').split('/')[0].trim();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'th-TH';
  if(thaiVoice) u.voice = thaiVoice;
  u.rate = 0.85;
  speechSynthesis.speak(u);
  if(!thaiVoice) toast('タイ語音声が端末にない場合、正しく再生されないことがあります');
}

    arr = arr.filter(v=>{ const p=state.progress[v.id]; return !(p && p.status==='known'); });
  }
  // プレミアム: 復習優先(SRS) = 未学習 or 復習期限が来た語のみ
  if(state.premium && state.srsMode){
    arr = arr.filter(v=>{ const p=state.progress[v.id]; return !p || p.status==='new' || isDue(p); });
  }
  return arr;
}
// 出題プールが空のときの説明メッセージ(プレミアム機能の状態を考慮)
function emptyPoolMsg(){
  if(state.reviewMode) return '復習対象の単語がありません。カードや4択クイズで「もう一度」を押すとここに溜まります。';
  if(state.premium && state.srsMode) return '今この範囲で復習期限が来た単語はありません。「復習優先」を解除するか、時間をおいて再挑戦してください。';
  if(state.premium && state.hideKnown) return 'この範囲は「記憶済み」ばかりです。「記憶済みを除く」を解除するか、範囲を広げてください。';
  return 'この条件に一致する単語がありません';
}
// カード/クイズの出題順。SRS時は「期限切れ(古い順)→未学習」の順で並べる
function orderedSet(){
  const arr = baseFiltered();
  if(state.premium && state.srsMode){
    const due = arr.filter(v=>isDue(state.progress[v.id]));
    due.sort((a,b)=>state.progress[a.id].due - state.progress[b.id].due);
    const fresh = shuffle(arr.filter(v=>{ const p=state.progress[v.id]; return !p || p.status==='new'; }));
    return [...due, ...fresh];
  }
  return shuffle(arr);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function markWord(id, status){
  const now = Date.now();
  const cur = state.progress[id] || {status:'new', count:0, ease:2.5, interval:0};
  cur.count = (cur.count||0)+1;
  if(cur.ease==null) cur.ease = 2.5;
  if(cur.interval==null) cur.interval = 0;
  // 忘却曲線(SM-2簡易版)による次回復習日の算出
  if(status==='known'){
    if(cur.interval<=0) cur.interval = 1;
    else if(cur.interval===1) cur.interval = 3;
    else cur.interval = Math.round(cur.interval * cur.ease);
    cur.ease = Math.min(2.8, cur.ease + 0.05);
    cur.due = now + cur.interval*86400000;   // interval日後
  }else{ // learning(もう一度/不正解): 間隔リセットし当日中に再出題
    cur.interval = 0;
    cur.ease = Math.max(1.3, cur.ease - 0.2);
    cur.due = now + 10*60*1000;              // 10分後=実質すぐ復習対象
  }
  cur.status = status; cur.last = now;
  state.progress[id] = cur;
  saveProgress();
}
function learningWords(){
  return VOCAB.filter(v=>{ const p=state.progress[v.id]; return p && p.status==='learning'; });
}

function beadsHtml(total, idx){
  if(total===0) return '';
  const MAX = 40;
  // 小さいデッキ: 1点=1枚(1枚ごとに現在位置が動く)
  if(total <= MAX){
    let html = '<div class="beads">';
    for(let i=0;i<total;i++){
      let cls='bead'; if(i<idx) cls+=' done'; if(i===idx) cls+=' cur';
      html += `<div class="${cls}"></div>`;
    }
    return html+'</div>';
  }
  // 大きいデッキ: 40点を進捗割合で塗る。現在位置マーカーが最後まで動き続ける
  const curPos = Math.min(MAX-1, Math.round(idx/(total-1)*(MAX-1)));
  let html = '<div class="beads">';
  for(let i=0;i<MAX;i++){
    let cls='bead'; if(i<curPos) cls+=' done'; if(i===curPos) cls+=' cur';
    html += `<div class="${cls}"></div>`;
  }
  return html+'</div>';
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1900);
}

                <div class="qr-thai">${r.thai}</div>

        if(!state.premium){ toast('CSVダウンロードはプレミアム限定です'); return; }
        if(log.length===0){ toast('結果がありません'); return; }
        const rows=[['正誤','タイ語','発音目安','正解の意味','選んだ意味','他の選択肢(意味/タイ語/発音)'].join(',')]

      q._choices = shuffle([{meaning:q.meaning, thai:q.thai, kana:q.kana||'', correct:true}, ...distractors]);

            if(c.correct) cls+=' correct';
            else if(i===state.quizChosen) cls+=' wrong';
          }
          const thaiLine = answered
            ? `<span class="ch-th" data-say="${c.thai.replace(/"/g,'&quot;')}">${c.thai}${c.kana?'（'+c.kana+'）':''} 🔊</span>`
            : '';
          return `<div class="${cls}" data-i="${i}"><span class="ch-ja">${c.meaning}</span>${thaiLine}</div>`;
        }).join('')}
      </div>
      <div id="quizExample">${answered?exampleBoxHtml(q):''}</div>
      ${answered?'<button class="next-btn" id="nextQ">次へ</button>':''}`;
    bindReviewExit();
    bindSpeakButtons(view);
    const nextBtn = document.getElementById('nextQ');
    if(nextBtn) nextBtn.onclick=()=>{state.quizIdx++;state.quizAnswered=false;state.quizChosen=null;renderView();};
    if(!answered){
      document.querySelectorAll('.choice').forEach(el=>{
        el.onclick=()=>{
          if(state.quizAnswered) return;
          const idx=parseInt(el.dataset.i);
          const chosen=q._choices[idx];
          state.quizAnswered=true;
          state.quizChosen=idx;
          const isOk=chosen.correct;
          if(isOk){state.quizScore++;markWord(q.id,'known');}
          else{markWord(q.id,'learning');}
          const otherChoices = q._choices.filter((c,ci)=>ci!==idx).map(c=>({meaning:c.meaning, thai:c.thai, kana:c.kana||''}));
          state.quizLog.push({thai:q.thai, kana:q.kana||'', meaning:q.meaning, chosen:chosen.meaning, ok:isOk, otherChoices});
          renderLevelFilters();
          renderView();
        };
      });
    }
  }

  else if(state.mode==='list'){
    if(list.length===0){
      view.innerHTML = reviewBannerHtml()+`<div class="empty">${emptyPoolMsg()}</div>`;
      bindReviewExit(); return;
    }
    const csvScopeFree = list.filter(w=>w.level==='基礎');
    view.innerHTML = `
      ${reviewBannerHtml()}
      <div class="meta-line">${state.reviewMode?'復習対象':levelLabel(state.level)+'　'+state.category}　全${list.length}語${state.premium?'':'　・　例文🔒は一部無料'}</div>
      <div class="list-actions">
        <button id="copyBtn">📋 コピー${state.premium?'':'(無料:基礎のみ)'}</button>
        <button id="csvBtn">⬇ CSV${state.premium?'':'(無料:基礎のみ)'}</button>
      </div>
      <table class="list-table">
        <thead><tr><th>タイ語 / 発音目安</th><th>意味</th><th>例文</th></tr></thead>
        <tbody>
          ${list.map(w=>{
            const ex = getExample(w);
            let exCell;
            if(!exampleAllowed(w)) exCell = `<td class="ew lock">🔒 プレミアム</td>`;
            else if(ex && !ex.error) exCell = `<td class="ew">${ex.thai}<span class="eja">${ex.ja}</span></td>`;
            else exCell = `<td class="ew lock">例文準備中</td>`;
            return `<tr>
              <td class="tw">${w.thai}<span class="k">${w.kana||''}</span></td>
              <td class="mw">${w.meaning}</td>
              ${exCell}
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
    bindReviewExit();
    const exportList = state.premium ? list : csvScopeFree;
    document.getElementById('copyBtn').onclick = async ()=>{
      if(exportList.length===0){ toast('無料版では基礎レベルのみ書き出せます'); return; }
      const lines = exportList.map(w=>{
        const ex = exampleAllowed(w) ? getExample(w) : null;
        const exs = (ex && !ex.error) ? `\t${ex.thai}\t${ex.ja}` : '';
        return `${w.thai}\t${w.kana||''}\t${w.meaning}${exs}`;
      }).join('\n');
      try{ await navigator.clipboard.writeText(lines); toast(`コピーしました(${exportList.length}語)`);}
      catch(e){ toast('コピーに失敗しました'); }
    };
    document.getElementById('csvBtn').onclick = ()=>{
      if(exportList.length===0){ toast('無料版では基礎レベルのみ書き出せます'); return; }
      const rows=[['タイ語','発音目安','意味','レベル','カテゴリ','例文','例文訳'].join(',')]
        .concat(exportList.map(w=>{
          const ex = exampleAllowed(w) ? getExample(w) : null;
          const et = (ex&&!ex.error)?ex.thai:''; const ej=(ex&&!ex.error)?ex.ja:'';
          return [w.thai,w.kana||'',w.meaning,w.level,w.category,et,ej]
            .map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',');
        }));
      const blob=new Blob(["\uFEFF"+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=`thai_vocab_${state.reviewMode?'review':state.level+'_'+state.category}.csv`;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast(`CSVを書き出しました(${exportList.length}語)`);
    };
  }

  else if(state.mode==='search'){
    view.innerHTML = `
      <input class="search-box" id="searchInput" placeholder="タイ語・カタカナ・日本語で検索...">
      <div class="search-results" id="searchResults"></div>`;
    const input=document.getElementById('searchInput');
    const results=document.getElementById('searchResults');
    function norm(s){ return s.replace(/[ぁ-ん]/g, ch=>String.fromCharCode(ch.charCodeAt(0)+0x60)).replace(/ー|・|\s/g,''); }
    input.oninput=()=>{
      const q=input.value.trim();
      if(!q){results.innerHTML='';return;}
      const qn=norm(q);
      const hits=baseFiltered().filter(v=>
        v.thai.includes(q) || v.meaning.includes(q) ||
        (v.kana && norm(v.kana).includes(qn))
      ).slice(0,80);
      results.innerHTML = hits.length ? hits.map(v=>`
        <div class="result-row">
          <div>
            <div class="rt">${v.thai}</div>
            <span class="rk">${v.kana||''}</span>
            <span class="rc">${v.level}・${v.category}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="rm">${v.meaning}</div>
            <button class="mini-speak" data-say="${v.thai.replace(/"/g,'&quot;')}">🔊</button>
          </div>
        </div>`).join('') : `<div class="empty">見つかりませんでした</div>`;
      bindSpeakButtons(results);
    };
  }

  else if(state.mode==='stats'){
    const byLevel={};
    LEVELS.filter(l=>l!=='全体').forEach(l=>byLevel[l]={known:0,learning:0,total:0});
    let known=0,learning=0;
    VOCAB.forEach(v=>{
      const p=state.progress[v.id];
      byLevel[v.level].total++;
      if(p&&p.status==='known'){byLevel[v.level].known++;known++;}
      else if(p&&p.status==='learning'){byLevel[v.level].learning++;learning++;}
    });
    const lc = learningWords().length;
    view.innerHTML = `
      <div class="stats-grid">
        <div class="stat-box known ${state.statsList==='known'?'selected':''}" data-slist="known"><div class="num">${known}</div><div class="lbl">覚えた ▾</div></div>
        <div class="stat-box learning ${state.statsList==='learning'?'selected':''}" data-slist="learning"><div class="num">${learning}</div><div class="lbl">復習中 ▾</div></div>
        <div class="stat-box ${state.statsList==='started'?'selected':''}" data-slist="started"><div class="num">${known+learning}</div><div class="lbl">着手済 ▾</div></div>
      </div>
      ${statsListHtml()}
      <button class="review-cta" id="startReview" ${lc===0?'disabled':''}>
        ${lc===0?'復習する単語はまだありません':'「もう一度」の単語を復習する('+lc+'語)'}
      </button>
      ${LEVELS.filter(l=>l!=='全体').map(l=>{
        const b=byLevel[l];
        return `<div class="level-bar">
          <div class="lvl-name">${l}　${b.known+b.learning} / ${b.total} 語 着手</div>
          <div class="bar-track">
            <div class="bar-fill known" style="width:${(b.known/b.total*100).toFixed(0)}%"></div>
            <div class="bar-fill learning" style="width:${(b.learning/b.total*100).toFixed(0)}%"></div>
          </div></div>`;
      }).join('')}
      <div class="reset-link" id="resetLink">学習記録をリセット</div>`;
    document.querySelectorAll('[data-slist]').forEach(b=>{
      b.onclick=()=>{
        state.statsList = (state.statsList===b.dataset.slist) ? null : b.dataset.slist;
        renderView();
      };
    });
    document.getElementById('startReview').onclick=()=>{
      if(lc===0) return;
      state.reviewMode=true; state.mode='card';
      resetCardSet(); renderAll();
    };
    document.getElementById('resetLink').onclick=async()=>{
      if(confirm('全ての学習記録を消去します。よろしいですか？')){
        state.progress={}; await saveProgress(); renderAll();
      }
    };
  }
}

function renderAll(){
  renderLevelFilters();
  renderCatFilter();
  renderTabs();
  renderPremiumBtn();
  renderStudyToggles();
  if(state.mode==='card') resetCardSet();
  if(state.mode==='quiz') resetQuizSet();
  renderView();
}

(async function init(){
  await loadAll();
  renderAll();
})();
</script>
</body>
</html>
